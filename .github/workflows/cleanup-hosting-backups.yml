name: Depurar respaldos antiguos autorizados
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: igraphito-production-ftps
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ false }} # One-time authorized cleanup completed; retained for audit only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar respaldos recientes y eliminar exclusivamente dos archivos antiguos
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python -u - <<'PY'
          import ftplib, os, ssl, socket, tempfile, zipfile, json
          host, tls_name = 'ftp.igraphito.com', 'nemesis.sipanserver.com'
          keep = {'public_html-20261021T161910Z.zip': 10666612, 'public_html-20261104T220404Z.zip': 10663431}
          remove = {'public_html-20261021T155712Z.zip': 5586208, 'public_html-20261021T160006Z.zip': 10666612}
          if not set(socket.gethostbyname_ex(host)[2]).intersection(socket.gethostbyname_ex(tls_name)[2]):
              raise SystemExit('Hosting DNS mismatch')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=90)
          try:
              ftp.connect(host, 21)
              ftp.host = tls_name
              ftp.login('igraphito', os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.cwd('igraphito-private-backups')
              assert ftp.pwd() == '/igraphito-private-backups', 'Unexpected backup directory'
              def inventory():
                  return {n: int(f['size']) for n, f in ftp.mlsd() if f.get('type') == 'file'}
              before = inventory()
              for name, size in {**keep, **remove}.items():
                  assert before.get(name) == size, 'Inventory changed: ' + name
              for name, size in keep.items():
                  with tempfile.TemporaryFile() as archive:
                      ftp.retrbinary('RETR ' + name, archive.write)
                      assert archive.tell() == size, 'Incomplete retained backup'
                      archive.seek(0)
                      with zipfile.ZipFile(archive) as z:
                          assert z.testzip() is None, 'Retained backup CRC failure'
                          assert any(n in z.namelist() for n in ['public_html/index.html', 'public_html/index.php', 'public_html/index.htm']), 'Retained backup missing homepage'
                          print('VERIFIED retained backup:', name, size)
              for name, size in remove.items():
                  current = inventory()
                  assert current.get(name) == size
                  assert all(current.get(n) == s for n, s in keep.items())
                  ftp.delete(name)
                  print('DELETED:', name, size)
              after = inventory()
              assert all(n not in after for n in remove)
              assert {n:s for n,s in before.items() if n not in remove} == after, 'Unexpected inventory difference'
              print(json.dumps({'deleted_count': len(remove), 'freed_bytes': sum(remove.values()), 'remaining_bytes': sum(after.values()), 'remaining_files': after}, indent=2))
          finally:
              ftp.close()
          PY
