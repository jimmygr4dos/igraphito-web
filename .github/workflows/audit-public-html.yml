name: Auditoria previa de limpieza (solo lectura)
on:
  push:
    paths:
      - '.github/workflows/audit-public-html.yml'
      - 'scripts/audit_cleanup.py'
      - 'scripts/check_cleanup_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar candidato de produccion sin publicar
        run: python scripts/build.py
      - name: Inventario, huellas y referencias del hosting sin cambios
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python -u scripts/audit_cleanup.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Simular ausencia de candidatos solo en navegador aislado
        run: node scripts/check_cleanup_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphito-cleanup-readonly-audit
          path: qa/
          retention-days: 14
