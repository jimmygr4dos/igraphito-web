name: Inventario de public_html (solo lectura)
on:
  push:
    paths:
      - '.github/workflows/audit-public-html.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generar manifiesto de la web nueva
        run: python3 scripts/build.py
      - name: Listar archivos del hosting sin modificar nada
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -u - <<'PY'
          import ftplib, ssl, socket, os, json
          from pathlib import Path
          host = 'nemesis.sipanserver.com'
          assert set(socket.gethostbyname_ex(host)[2]) & set(socket.gethostbyname_ex('igraphito.com')[2])
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=90)
          ftp.connect('igraphito.com', 21)
          ftp.host = host
          ftp.login('igraphito@igraphito.com', os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('public_html')
          base = ftp.pwd()
          expected = {str(p.relative_to('dist')) for p in Path('dist').rglob('*') if p.is_file()}
          entries = []
          def scan(remote, relative=''):
              for name, facts in ftp.mlsd(remote):
                  kind = facts.get('type')
                  if kind in ('cdir', 'pdir'):
                      continue
                  assert name not in ('.', '..') and '/' not in name and '\\' not in name
                  path = relative + name
                  entries.append({'path': path, 'type': kind, 'size': int(facts.get('size', 0)), 'new_build': path in expected})
                  if kind == 'dir':
                      scan(remote.rstrip('/') + '/' + name, path + '/')
          try:
              scan(base)
              print('INVENTORY_JSON=' + json.dumps(entries, ensure_ascii=False))
              print('BUILD_MANIFEST_JSON=' + json.dumps(sorted(expected)))
          finally:
              ftp.close()
          PY
