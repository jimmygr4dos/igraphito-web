name: Publish Graphito review to GitHub Pages
on:
  push:
    branches:
      - feature/papeles-regalo-empresariales
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/publish-review-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: graphito-review-pages
  cancel-in-progress: false
jobs:
  publish-review:
    if: github.ref == 'refs/heads/feature/papeles-regalo-empresariales'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GitHub Pages preview
        run: python scripts/build.py --base-path igraphito-web --site-url https://jimmygr4dos.github.io
      - name: Validate generated pages
        run: |
          python scripts/check.py
          python scripts/check_seo.py
      - name: Publish generated files to gh-pages only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -a dist /tmp/igraphito-preview-dist
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/igraphito-preview-dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish corporate gift wrapping preview"
            git push origin HEAD:gh-pages
          fi
